---

#hostid
- hosts: webservers
#taskid
  tasks:
#php install
    - name: Install php (Debian)
      package:
        name: 
          - php
          - libapache2-mod-php
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
    
#php ja phpfpm install redhat linuxite jaoks
    - name: Install php (RedHat)
      package:
        name: 
          - php
          - php-fpm
        state: present
      when: ansible_os_family == "RedHat"
    
# phpinfo tegemine ja õiguste andmine
    - name: Create phpinfo.php
      copy:
        dest: /var/www/html/phpinfo.php
        mode: 0644
        content: |
          <?php
          phpinfo();
          ?>
    
#httpd ja apache2 restart
    - name: Restart web server
      service:
        name: "{{ 'apache2' if ansible_os_family == 'Debian' else 'httpd' }}"
        state: restarted
